<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단지계획 벼락치기</title>
<meta name="description" content="단지계획 1~3주차 시험 대비: 핵심 정리 · 플래시카드 · 퀴즈 · 비교표 · 숫자 암기">
<meta name="theme-color" content="#f6f7f9">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#5f6670; --line:#e3e6ea; --line-strong:#cfd4da;
  --accent:#2f6fed; --accent-weak:#e8effd; --ok:#1f9d55; --ok-weak:#e6f6ec; --bad:#d64545; --bad-weak:#fdecec;
  --warn:#b7791f; --warn-weak:#fdf3e1; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --radius:12px; --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --card:#181c22; --text:#e7eaee; --muted:#9aa3ad; --line:#2a3039; --line-strong:#3a424d;
    --accent:#6d9cff; --accent-weak:#1c2a45; --ok:#4cc37a; --ok-weak:#123324; --bad:#f07070; --bad-weak:#3a1a1a;
    --warn:#e0a94a; --warn-weak:#3a2c12; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --card:#181c22; --text:#e7eaee; --muted:#9aa3ad; --line:#2a3039; --line-strong:#3a424d;
  --accent:#6d9cff; --accent-weak:#1c2a45; --ok:#4cc37a; --ok-weak:#123324; --bad:#f07070; --bad-weak:#3a1a1a;
  --warn:#e0a94a; --warn-weak:#3a2c12; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px 14px;min-height:40px;transition:background .12s,border-color .12s,transform .05s}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.app{max-width:960px;margin:0 auto;padding:0 16px 96px}
header{padding:20px 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:18px;font-weight:700;margin-top:2px}
.stat .bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding-left:16px;padding-right:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;color:var(--muted)}
.tab .ic{margin-right:4px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:600px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line);background:var(--card);overflow:visible}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:52px;border:none;border-radius:10px;font-size:12px;background:transparent}
  .tab .ic{margin:0;font-size:20px;line-height:1}
  .tab.active{background:var(--accent-weak);color:var(--accent)}
}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border-radius:999px;padding:6px 12px;min-height:34px;font-size:14px;color:var(--muted)}
.chip.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.toggle.active{background:var(--warn-weak);border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);vertical-align:middle;margin-right:4px}
.badge.w{background:var(--warn-weak);color:var(--warn)}
.badge.g{background:var(--ok-weak);color:var(--ok)}
.badge.n{background:var(--line);color:var(--muted)}
.badge.r{background:var(--bad-weak);color:var(--bad)}
.tagline{display:inline-flex;flex-wrap:wrap;gap:4px}
/* summary */
.unit-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;flex-wrap:wrap}
.unit-h h2{font-size:18px;margin:0}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
details.sec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .arrow{width:18px;color:var(--muted);transition:transform .15s;flex:none}
details.sec[open] summary .arrow{transform:rotate(90deg)}
details.sec summary .t{flex:1}
details.sec.done summary .t{color:var(--muted);text-decoration:line-through}
details.sec .body{padding:0 16px 14px}
.pt{margin:0;padding:0;list-style:none}
.pt>li{padding:8px 0;border-top:1px dashed var(--line)}
.pt>li:first-child{border-top:none}
.pt .txt{display:block}
.pt ul{margin:6px 0 0 4px;padding-left:16px;color:var(--muted);font-size:14.5px}
.pt ul li{margin:3px 0}
.tip{margin-top:12px;background:var(--warn-weak);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14.5px}
.secbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;min-height:var(--tap)}
.check input{width:18px;height:18px;accent-color:var(--ok)}
/* flashcards */
.fc-wrap{margin-top:10px}
.fc{position:relative;min-height:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px;cursor:pointer;user-select:none;display:flex;flex-direction:column}
.fc .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.fc .face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;line-height:1.5;white-space:pre-line}
.fc.flipped .face{font-weight:500;font-size:17px;color:var(--text)}
.fc .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.fc.flipped{border-color:var(--accent)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-actions button{min-height:52px;font-size:16px;font-weight:700}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent)}
.done-box{text-align:center;padding:36px 16px}
.done-box .big{font-size:40px}
/* quiz */
.q{font-size:18px;font-weight:600;line-height:1.5;margin:8px 0 14px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;min-height:48px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.opt.correct{background:var(--ok-weak);border-color:var(--ok)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-weak);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fill{display:flex;gap:8px}
.fill input{flex:1;min-height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card);font-size:17px}
.fill input:focus{outline:2px solid var(--accent);border-color:transparent}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px;white-space:pre-line}
.verdict.ok{background:var(--ok-weak);border-left:3px solid var(--ok)}
.verdict.bad{background:var(--bad-weak);border-left:3px solid var(--bad)}
.verdict .ans{font-weight:700}
.kw{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.kw li{background:var(--accent-weak);border-radius:8px;padding:8px 12px}
.oxbtn{min-height:60px;font-size:24px;font-weight:800}
.next{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.next .primary{flex:1;min-height:48px;font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.score .card{text-align:center}
.score .n{font-size:28px;font-weight:800}
.wronglist{margin:0;padding-left:18px;font-size:14.5px}
.wronglist li{margin:4px 0}
/* tables */
.tbl{margin-bottom:16px}
.tbl h3{font-size:16px;margin:0 0 8px}
.tbl .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left;white-space:pre-line}
th{background:var(--accent-weak);color:var(--accent);font-weight:700;position:sticky;top:0}
td:first-child{font-weight:700;background:var(--bg);white-space:nowrap;position:sticky;left:0}
th:first-child{position:sticky;left:0;z-index:1}
tr:last-child td{border-bottom:none}
.note{font-size:13px;color:var(--muted);margin-top:6px}
/* numbers */
.num{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow)}
.num .l{flex:1;min-width:0}
.num .label{font-weight:600}
.num .src{font-size:12px;color:var(--muted);margin-top:2px}
.num .v{flex:none;min-width:120px;text-align:center;padding:10px 12px;border-radius:10px;background:var(--accent-weak);color:var(--accent);font-weight:800;cursor:pointer;min-height:var(--tap);display:flex;align-items:center;justify-content:center;font-size:15px;white-space:pre-line}
.num .v.hidden{background:var(--line);color:transparent;text-shadow:0 0 12px var(--muted);position:relative}
.num .v.hidden::after{content:"탭해서 확인";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:600;text-shadow:none}
.num .star{flex:none;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;border-color:transparent;background:transparent}
.num.unk{border-color:var(--warn)}
.num .star.on{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.kbd{display:inline-block;font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);margin:0 1px}
footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:600px){
  .app{padding-bottom:110px}
  .brand h1{font-size:20px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:8px 10px}.stat .val{font-size:16px}
  .fc{min-height:240px}
  .num .v{min-width:100px}
  .kbd,.kb-only{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div>
        <h1>🏘️ 단지계획 벼락치기</h1>
        <div class="sub">1~3주차 · 정리 → 카드 → 퀴즈 → 비교표 → 숫자 순으로 · <a href="story.html" style="color:var(--accent);font-weight:700;text-decoration:none">📚 이야기로 읽기</a></div>
      </div>
      <button class="ghost" id="themeBtn" title="테마 전환" aria-label="테마 전환">🌓</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="summary"><span class="ic">📖</span><span class="lb">정리</span></button>
    <button class="tab" data-tab="cards"><span class="ic">🃏</span><span class="lb">카드</span></button>
    <button class="tab" data-tab="quiz"><span class="ic">✏️</span><span class="lb">퀴즈</span></button>
    <button class="tab" data-tab="tables"><span class="ic">📊</span><span class="lb">비교표</span></button>
    <button class="tab" data-tab="numbers"><span class="ic">🔢</span><span class="lb">숫자</span></button>
  </nav>
  <main id="view"></main>
  <footer>진행 상태는 이 브라우저에만 저장됩니다 · <button class="ghost small" id="resetBtn" style="min-height:28px;padding:2px 8px">진행 초기화</button></footer>
</div>

<script src="data/unit1.js"></script>
<script src="data/unit2.js"></script>
<script src="data/unit3.js"></script>
<script src="data/unit4.js"></script>
<script src="data/unit5.js"></script>
<script>
(function(){
'use strict';
/* ---------- data ---------- */
const UNITS=(window.STUDY_UNITS||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
const ALL={sections:[],cards:[],quiz:[],comparisons:[],numbers:[]};
UNITS.forEach(u=>{
  const meta={unit:u.id,unitTitle:u.title,week:u.week};
  (u.sections||[]).forEach(s=>ALL.sections.push(Object.assign({},s,meta)));
  (u.cards||[]).forEach(c=>ALL.cards.push(Object.assign({},c,meta)));
  (u.quiz||[]).forEach(q=>ALL.quiz.push(Object.assign({},q,meta)));
  (u.comparisons||[]).forEach(t=>ALL.comparisons.push(Object.assign({},t,meta)));
  (u.numbers||[]).forEach(n=>ALL.numbers.push(Object.assign({},n,meta)));
});
const SEC_TITLE={};ALL.sections.forEach(s=>SEC_TITLE[s.id]=s.title);

/* ---------- state ---------- */
const KEY='danji-study-v1';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')return s;}catch(e){}return null;}
const S=Object.assign({done:{},cards:{},solved:{},numUnknown:{},theme:'auto',tab:'summary'},load()||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const F={sumUnit:'all',cardUnit:'all',cardType:'all',cardUnknown:false,quizUnit:'all',quizType:'all',quizWrong:false,tblUnit:'all',numUnit:'all',numUnknown:false,numShowAll:false};
let CS=null; /* card session */
let QS=null; /* quiz session */

/* ---------- utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,'').replace(/[,，]/g,'').replace(/[~∼～\-–—]/g,'~').replace(/[()（）\[\]]/g,'').replace(/(\d)\.0+(?=\D|$)/g,'$1').replace(/(이상|이하|내외|정도)$/,'');}
function stripUnit(s){return s.replace(/(명|미터|m|km|㎡|m2|db|%|년|배|호|가구|층|분|개|가지|acres|에이커|mile|마일)+$/,'');}
function fillMatch(input,q){const i=norm(input);if(!i)return false;const cands=[q.answer].concat(q.accept||[]).map(norm);return cands.some(c=>c===i||stripUnit(c)===stripUnit(i));}
const TYPE_LABEL={mc:'객관식',fill:'빈칸',ox:'O/X',keywords:'키워드'};
const CARD_TYPES=['정의','숫자','비교','사례','인물','연도','법규','장단점'];
function unitChips(cur,key,extra){
  let h=`<button class="chip ${cur==='all'?'active':''}" data-f="${key}" data-v="all">전체</button>`;
  UNITS.forEach(u=>{h+=`<button class="chip ${cur===u.id?'active':''}" data-f="${key}" data-v="${u.id}">${u.week}주차 · ${esc(u.title)}</button>`;});
  return `<div class="filters">${h}${extra||''}</div>`;
}
function tags(arr,cls){return (arr||[]).map(t=>`<span class="badge ${cls||''}">${esc(t)}</span>`).join('');}

/* ---------- theme ---------- */
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);$('themeBtn').textContent=S.theme==='auto'?'🌓':(S.theme==='dark'?'🌙':'☀️');}
$('themeBtn').addEventListener('click',()=>{S.theme=S.theme==='auto'?'light':(S.theme==='light'?'dark':'auto');save();applyTheme();});
applyTheme();

/* ---------- stats ---------- */
function renderStats(){
  const secDone=Object.keys(S.done).filter(k=>S.done[k]&&SEC_TITLE[k]).length, secTot=ALL.sections.length;
  const know=ALL.cards.filter(c=>S.cards[c.id]==='know').length, unk=ALL.cards.filter(c=>S.cards[c.id]==='unknown').length, cTot=ALL.cards.length;
  const corr=ALL.quiz.filter(q=>S.solved[q.id]==='correct').length, wrong=ALL.quiz.filter(q=>S.solved[q.id]==='wrong').length, qTot=ALL.quiz.length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  $('stats').innerHTML=`
    <div class="stat"><div class="lbl">정리 읽기</div><div class="val">${secDone}<span class="muted small">/${secTot}</span></div><div class="bar"><i style="width:${pct(secDone,secTot)}%"></i></div></div>
    <div class="stat"><div class="lbl">카드 알겠음</div><div class="val">${know}<span class="muted small">/${cTot}</span>${unk?` <span class="badge w">모름 ${unk}</span>`:''}</div><div class="bar"><i style="width:${pct(know,cTot)}%"></i></div></div>
    <div class="stat"><div class="lbl">퀴즈 정답</div><div class="val">${corr}<span class="muted small">/${qTot}</span>${wrong?` <span class="badge r">오답 ${wrong}</span>`:''}</div><div class="bar"><i style="width:${pct(corr,qTot)}%"></i></div></div>`;
}

/* ---------- tabs ---------- */
function setTab(t){S.tab=t;save();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));location.hash=t;render();window.scrollTo({top:0});}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setTab(b.dataset.tab);});
function render(){
  renderStats();
  const v=$('view');
  if(!UNITS.length){v.innerHTML='<div class="empty">데이터 파일(data/unit*.js)을 불러오지 못했습니다.</div>';return;}
  switch(S.tab){
    case 'cards':renderCards();break;
    case 'quiz':renderQuiz();break;
    case 'tables':renderTables();break;
    case 'numbers':renderNumbers();break;
    default:renderSummary();
  }
}

/* ---------- summary ---------- */
function renderSummary(){
  const units=UNITS.filter(u=>F.sumUnit==='all'||u.id===F.sumUnit);
  let h=unitChips(F.sumUnit,'sumUnit',`<button class="chip" data-act="sum-open">모두 펼치기</button><button class="chip" data-act="sum-close">모두 접기</button>`);
  units.forEach(u=>{
    h+=`<div class="unit-h"><span class="badge n">${u.week}주차</span><h2>${esc(u.title)}</h2><span class="muted small">${(u.sections||[]).length}개 소단원 · 카드 ${(u.cards||[]).length} · 퀴즈 ${(u.quiz||[]).length}</span></div>`;
    (u.sections||[]).forEach(s=>{
      const done=!!S.done[s.id];
      h+=`<details class="sec ${done?'done':''}" id="sec-${s.id}" ${done&&F.sumUnit==='all'?'':'open'}>
        <summary><span class="arrow">▶</span><span class="t">${esc(s.title)}</span>${done?'<span class="badge g">완료</span>':''}</summary>
        <div class="body">
          <ul class="pt">${(s.points||[]).map(p=>`<li><span class="txt">${p.tags&&p.tags.length?`<span class="tagline">${tags(p.tags)}</span> `:''}${esc(p.text)}</span>${p.sub&&p.sub.length?`<ul>${p.sub.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</li>`).join('')}</ul>
          ${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}
          <div class="secbtns">
            <label class="check"><input type="checkbox" data-act="done" data-id="${s.id}" ${done?'checked':''}> 읽었음</label>
            <button class="ghost small" data-act="goto-cards" data-unit="${u.id}">이 단원 카드 →</button>
            <button class="ghost small" data-act="goto-quiz" data-unit="${u.id}">이 단원 퀴즈 →</button>
          </div>
        </div></details>`;
    });
  });
  $('view').innerHTML=h;
}

/* ---------- flashcards ---------- */
function cardPool(){return ALL.cards.filter(c=>(F.cardUnit==='all'||c.unit===F.cardUnit)&&(F.cardType==='all'||c.type===F.cardType)&&(!F.cardUnknown||S.cards[c.id]==='unknown'));}
function startCards(){const pool=cardPool();CS={queue:shuffle(pool),idx:0,flipped:false,requeued:{},seen:0,total:pool.length,unk:0};}
function renderCards(){
  if(!CS)startCards();
  const typeChips=`<div class="filters"><button class="chip ${F.cardType==='all'?'active':''}" data-f="cardType" data-v="all">전체 유형</button>${CARD_TYPES.filter(t=>ALL.cards.some(c=>c.type===t)).map(t=>`<button class="chip ${F.cardType===t?'active':''}" data-f="cardType" data-v="${t}">${t}</button>`).join('')}<button class="chip toggle ${F.cardUnknown?'active':''}" data-act="toggle" data-f="cardUnknown">모름만 ${ALL.cards.filter(c=>S.cards[c.id]==='unknown').length}</button></div>`;
  let h=unitChips(F.cardUnit,'cardUnit')+typeChips;
  const total=CS.queue.length;
  if(!total){h+=`<div class="empty">조건에 맞는 카드가 없습니다.</div>`;$('view').innerHTML=h;return;}
  if(CS.idx>=total){
    h+=`<div class="card done-box"><div class="big">🎉</div><div style="font-size:18px;font-weight:700;margin:8px 0">한 바퀴 완료!</div><div class="muted">${CS.total}장 중 모름 ${CS.unk}장</div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="primary" data-act="cards-restart">다시 섞어서</button>${CS.unk?`<button data-act="cards-unknown">모름만 다시</button>`:''}</div></div>`;
    $('view').innerHTML=h;return;
  }
  const c=CS.queue[CS.idx];
  const st=S.cards[c.id];
  h+=`<div class="fc-wrap">
    <div class="row spread small muted"><span>${CS.idx+1} / ${total}${CS.requeued[c.id]?' · 재등장':''}</span><span>${st==='know'?'<span class="badge g">알겠음</span>':st==='unknown'?'<span class="badge w">모름</span>':''}</span></div>
    <div class="progress"><i style="width:${Math.round(CS.idx/total*100)}%"></i></div>
    <div class="fc ${CS.flipped?'flipped':''}" data-act="flip" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="meta"><span><span class="badge">${esc(c.type||'')}</span>${c.week}주차 · ${esc(c.unitTitle)}</span><span>${c.section&&SEC_TITLE[c.section]?esc(SEC_TITLE[c.section]):''}</span></div>
      <div class="face">${esc(CS.flipped?c.back:c.front)}</div>
      <div class="hint">${CS.flipped?'← 모름 / 알겠음 →':'탭해서 뒤집기<span class="kb-only"> · <span class="kbd">Space</span></span>'}</div>
    </div>
    <div class="fc-actions">
      <button class="bad" data-act="card-unknown" ${CS.flipped?'':'disabled'}>✗ 모름 <span class="kbd">←</span></button>
      <button class="ok" data-act="card-know" ${CS.flipped?'':'disabled'}>✓ 알겠음 <span class="kbd">→</span></button>
    </div>
    <div class="row spread" style="margin-top:10px"><button class="ghost small" data-act="cards-restart">🔀 다시 섞기</button><button class="ghost small" data-act="card-skip">건너뛰기</button></div>
  </div>`;
  $('view').innerHTML=h;
}
function markCard(status){
  if(!CS||CS.idx>=CS.queue.length)return;
  const c=CS.queue[CS.idx];S.cards[c.id]=status;save();
  if(status==='unknown'){CS.unk++;if(!CS.requeued[c.id]){CS.requeued[c.id]=true;CS.queue.push(c);}}
  CS.idx++;CS.flipped=false;render();
}

/* ---------- quiz ---------- */
function quizPool(){return ALL.quiz.filter(q=>(F.quizUnit==='all'||q.unit===F.quizUnit)&&(F.quizType==='all'||q.type===F.quizType)&&(!F.quizWrong||S.solved[q.id]==='wrong'));}
function startQuiz(){const pool=quizPool();QS={queue:shuffle(pool),idx:0,answered:false,correct:0,wrong:0,wrongIds:[],revealed:false,picked:null,input:''};}
function renderQuiz(){
  if(!QS)startQuiz();
  const wrongN=ALL.quiz.filter(q=>S.solved[q.id]==='wrong').length;
  let h=unitChips(F.quizUnit,'quizUnit')+`<div class="filters"><button class="chip ${F.quizType==='all'?'active':''}" data-f="quizType" data-v="all">전체 유형</button>${Object.keys(TYPE_LABEL).map(t=>`<button class="chip ${F.quizType===t?'active':''}" data-f="quizType" data-v="${t}">${TYPE_LABEL[t]}</button>`).join('')}<button class="chip toggle ${F.quizWrong?'active':''}" data-act="toggle" data-f="quizWrong">오답만 ${wrongN}</button></div>`;
  const total=QS.queue.length;
  if(!total){h+=`<div class="empty">조건에 맞는 문제가 없습니다.</div>`;$('view').innerHTML=h;return;}
  if(QS.idx>=total){
    h+=`<div class="card"><div style="text-align:center;font-size:18px;font-weight:700">결과</div>
      <div class="score"><div class="card"><div class="n" style="color:var(--ok)">${QS.correct}</div><div class="muted small">정답</div></div><div class="card"><div class="n" style="color:var(--bad)">${QS.wrong}</div><div class="muted small">오답</div></div></div>
      ${QS.wrongIds.length?`<div style="font-weight:700;margin-bottom:6px">틀린 문제</div><ol class="wronglist">${QS.wrongIds.map(id=>{const q=ALL.quiz.find(x=>x.id===id);return q?`<li>${esc(q.q)}</li>`:''}).join('')}</ol>`:''}
      <div class="next"><button class="primary" data-act="quiz-restart">다시 풀기</button>${wrongN?`<button data-act="quiz-wrong">오답만 풀기 (${wrongN})</button>`:''}</div></div>`;
    $('view').innerHTML=h;return;
  }
  const q=QS.queue[QS.idx];
  h+=`<div class="row spread small muted"><span>${QS.idx+1} / ${total}</span><span>✓ ${QS.correct} · ✗ ${QS.wrong}</span></div><div class="progress"><i style="width:${Math.round(QS.idx/total*100)}%"></i></div>`;
  h+=`<div class="card"><div class="small muted"><span class="badge">${TYPE_LABEL[q.type]||q.type}</span>${q.week}주차 · ${esc(q.unitTitle)}${q.section&&SEC_TITLE[q.section]?' · '+esc(SEC_TITLE[q.section]):''}</div><div class="q">${esc(q.q)}</div>`;
  const res=QS.answered?QS.result:null;
  if(q.type==='mc'){
    h+=`<div class="opts">${q.options.map((o,i)=>{let cls='opt';if(QS.answered){if(i===q.answer)cls+=' correct';else if(i===QS.picked)cls+=' wrong';}return `<button class="${cls}" data-act="mc" data-i="${i}" ${QS.answered?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`;
  }else if(q.type==='fill'){
    h+=`<div class="fill"><input id="fillInput" type="text" placeholder="정답 입력 후 Enter" autocomplete="off" ${QS.answered?'disabled':''} value="${esc(QS.input)}"><button class="primary" data-act="fill-submit" ${QS.answered?'disabled':''}>확인</button></div>${QS.answered?'':'<div class="row" style="margin-top:8px"><button class="ghost small" data-act="fill-reveal">모르겠어요, 정답 보기</button></div>'}`;
  }else if(q.type==='ox'){
    h+=`<div class="opts" style="grid-template-columns:1fr 1fr"><button class="oxbtn opt ${QS.answered?(q.answer===true?'correct':(QS.picked===true?'wrong':'')):''}" data-act="ox" data-v="1" ${QS.answered?'disabled':''} style="justify-content:center">O</button><button class="oxbtn opt ${QS.answered?(q.answer===false?'correct':(QS.picked===false?'wrong':'')):''}" data-act="ox" data-v="0" ${QS.answered?'disabled':''} style="justify-content:center">X</button></div>`;
  }else if(q.type==='keywords'){
    if(!QS.revealed){h+=`<div class="muted small">머릿속으로 먼저 떠올린 다음 정답을 확인하세요.</div><div class="next"><button class="primary" data-act="kw-reveal">정답 보기 <span class="kbd">Enter</span></button></div>`;}
    else{h+=`<ul class="kw">${(q.keywords||[]).map((k,i)=>`<li>${i+1}. ${esc(k)}</li>`).join('')}</ul>${QS.answered?'':`<div class="next"><button class="ok" data-act="kw-self" data-v="1">다 떠올렸어요 <span class="kbd">1</span></button><button class="bad" data-act="kw-self" data-v="0">못 떠올렸어요 <span class="kbd">2</span></button></div>`}`;}
  }
  if(QS.answered){
    const ansTxt=q.type==='mc'?q.options[q.answer]:q.type==='ox'?(q.answer?'O':'X'):q.type==='fill'?q.answer:'';
    h+=`<div class="verdict ${res==='correct'?'ok':'bad'}">${res==='correct'?'✅ 정답!':'❌ 오답'}${ansTxt?`  ·  정답: <span class="ans">${esc(ansTxt)}</span>`:''}${q.explain?`\n${esc(q.explain)}`:''}</div>`;
    h+=`<div class="next"><button class="primary" data-act="quiz-next">다음 <span class="kbd">Enter</span></button>${res==='wrong'&&q.type==='fill'?`<button class="ghost small" data-act="quiz-override">사실 맞았어요</button>`:''}</div>`;
  }
  h+=`</div>`;
  $('view').innerHTML=h;
  if(q.type==='fill'&&!QS.answered){const inp=$('fillInput');if(inp){inp.focus();inp.addEventListener('input',()=>{QS.input=inp.value;});}}
}
function answerQuiz(correct,picked){
  if(!QS||QS.answered)return;const q=QS.queue[QS.idx];
  QS.answered=true;QS.result=correct?'correct':'wrong';QS.picked=picked;
  if(correct)QS.correct++;else{QS.wrong++;QS.wrongIds.push(q.id);}
  S.solved[q.id]=correct?'correct':'wrong';save();render();
}
function overrideQuiz(){if(!QS||!QS.answered||QS.result!=='wrong')return;const q=QS.queue[QS.idx];QS.result='correct';QS.wrong--;QS.correct++;QS.wrongIds=QS.wrongIds.filter(x=>x!==q.id);S.solved[q.id]='correct';save();render();}
function nextQuiz(){if(!QS)return;QS.idx++;QS.answered=false;QS.revealed=false;QS.picked=null;QS.input='';render();}

/* ---------- tables ---------- */
function renderTables(){
  const list=ALL.comparisons.filter(t=>F.tblUnit==='all'||t.unit===F.tblUnit);
  let h=unitChips(F.tblUnit,'tblUnit');
  if(!list.length){h+='<div class="empty">비교표가 없습니다.</div>';$('view').innerHTML=h;return;}
  h+=`<div class="muted small" style="margin-bottom:8px">표 ${list.length}개 · 가로로 스크롤할 수 있습니다</div>`;
  list.forEach(t=>{
    h+=`<div class="tbl card"><h3><span class="badge n">${t.week}주차</span>${esc(t.title)}</h3><div class="wrap"><table><thead><tr>${(t.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${(t.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${t.note?`<div class="note">※ ${esc(t.note)}</div>`:''}</div>`;
  });
  $('view').innerHTML=h;
}

/* ---------- numbers ---------- */
let NUM_ORDER=null;
function renderNumbers(){
  let list=ALL.numbers.filter(n=>(F.numUnit==='all'||n.unit===F.numUnit)&&(!F.numUnknown||S.numUnknown[n.id]));
  if(NUM_ORDER){const pos={};NUM_ORDER.forEach((id,i)=>pos[id]=i);list=list.slice().sort((a,b)=>(pos[a.id]??9999)-(pos[b.id]??9999));}
  const unkN=ALL.numbers.filter(n=>S.numUnknown[n.id]).length;
  let h=unitChips(F.numUnit,'numUnit',`<button class="chip toggle ${F.numUnknown?'active':''}" data-act="toggle" data-f="numUnknown">⭐ 표시만 ${unkN}</button><button class="chip" data-act="num-shuffle">🔀 섞기</button><button class="chip" data-act="num-showall">${F.numShowAll?'모두 가리기':'모두 보기'}</button>`);
  if(!list.length){h+='<div class="empty">항목이 없습니다.</div>';$('view').innerHTML=h;return;}
  h+=`<div class="muted small" style="margin-bottom:8px">${list.length}개 · 값을 탭하면 정답이 보입니다 · ⭐로 헷갈리는 것 표시</div>`;
  list.forEach(n=>{
    const unk=!!S.numUnknown[n.id];
    h+=`<div class="num ${unk?'unk':''}"><div class="l"><div class="label">${esc(n.label)}</div><div class="src">${n.source?esc(n.source):''}${n.hint?(n.source?' · ':'')+esc(n.hint):''}</div></div><div class="v ${F.numShowAll?'':'hidden'}" data-act="num-reveal">${esc(n.value)}</div><button class="star ${unk?'on':''}" data-act="num-star" data-id="${n.id}" aria-label="표시">${unk?'⭐':'☆'}</button></div>`;
  });
  $('view').innerHTML=h;
}

/* ---------- events ---------- */
$('view').addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-f]');if(!el)return;
  if(el.dataset.f&&el.dataset.v!==undefined&&!el.dataset.act){F[el.dataset.f]=el.dataset.v;if(el.dataset.f.startsWith('card'))startCards();if(el.dataset.f.startsWith('quiz'))startQuiz();render();return;}
  const act=el.dataset.act;
  switch(act){
    case 'toggle':F[el.dataset.f]=!F[el.dataset.f];if(el.dataset.f.startsWith('card'))startCards();if(el.dataset.f.startsWith('quiz'))startQuiz();render();break;
    case 'sum-open':document.querySelectorAll('details.sec').forEach(d=>d.open=true);break;
    case 'sum-close':document.querySelectorAll('details.sec').forEach(d=>d.open=false);break;
    case 'done':break; /* change 이벤트에서 처리 */
    case 'goto-cards':F.cardUnit=el.dataset.unit;F.cardUnknown=false;startCards();setTab('cards');break;
    case 'goto-quiz':F.quizUnit=el.dataset.unit;F.quizWrong=false;startQuiz();setTab('quiz');break;
    case 'flip':CS.flipped=!CS.flipped;render();break;
    case 'card-know':markCard('know');break;
    case 'card-unknown':markCard('unknown');break;
    case 'card-skip':if(CS){CS.idx++;CS.flipped=false;render();}break;
    case 'cards-restart':startCards();render();break;
    case 'cards-unknown':F.cardUnknown=true;startCards();render();break;
    case 'mc':{const q=QS.queue[QS.idx];const i=+el.dataset.i;answerQuiz(i===q.answer,i);break;}
    case 'ox':{const q=QS.queue[QS.idx];const v=el.dataset.v==='1';answerQuiz(v===q.answer,v);break;}
    case 'fill-submit':{const q=QS.queue[QS.idx];const inp=$('fillInput');QS.input=inp?inp.value:'';answerQuiz(fillMatch(QS.input,q),QS.input);break;}
    case 'fill-reveal':answerQuiz(false,null);break;
    case 'kw-reveal':QS.revealed=true;render();break;
    case 'kw-self':answerQuiz(el.dataset.v==='1',null);break;
    case 'quiz-next':nextQuiz();break;
    case 'quiz-override':overrideQuiz();break;
    case 'quiz-restart':startQuiz();render();break;
    case 'quiz-wrong':F.quizWrong=true;startQuiz();render();break;
    case 'num-reveal':el.classList.toggle('hidden');break;
    case 'num-star':{const id=el.dataset.id;if(S.numUnknown[id])delete S.numUnknown[id];else S.numUnknown[id]=true;save();render();break;}
    case 'num-shuffle':NUM_ORDER=shuffle(ALL.numbers.map(n=>n.id));render();break;
    case 'num-showall':F.numShowAll=!F.numShowAll;render();break;
  }
});
$('view').addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='done'){const id=el.dataset.id;S.done[id]=el.checked;save();renderStats();const d=$('sec-'+id);if(d)d.classList.toggle('done',el.checked);}});
$('resetBtn').addEventListener('click',()=>{if(confirm('진행 상태(읽음/카드/오답/표시)를 모두 지울까요?')){S.done={};S.cards={};S.solved={};S.numUnknown={};save();CS=null;QS=null;render();}});

document.addEventListener('keydown',e=>{
  const inInput=e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA');
  if(S.tab==='cards'&&CS&&CS.idx<CS.queue.length){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();CS.flipped=!CS.flipped;render();}
    else if((e.key==='ArrowLeft'||e.key==='1')&&CS.flipped){e.preventDefault();markCard('unknown');}
    else if((e.key==='ArrowRight'||e.key==='2')&&CS.flipped){e.preventDefault();markCard('know');}
  }else if(S.tab==='quiz'&&QS&&QS.idx<QS.queue.length){
    const q=QS.queue[QS.idx];
    if(e.key==='Enter'){
      if(QS.answered){e.preventDefault();nextQuiz();}
      else if(q.type==='fill'){e.preventDefault();const inp=$('fillInput');QS.input=inp?inp.value:'';answerQuiz(fillMatch(QS.input,q),QS.input);}
      else if(q.type==='keywords'&&!QS.revealed){e.preventDefault();QS.revealed=true;render();}
    }else if(!inInput&&!QS.answered){
      if(q.type==='mc'&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(i<q.options.length){e.preventDefault();answerQuiz(i===q.answer,i);}}
      else if(q.type==='ox'&&(e.key==='1'||e.key==='2'||e.key.toLowerCase()==='o'||e.key.toLowerCase()==='x')){e.preventDefault();const v=(e.key==='1'||e.key.toLowerCase()==='o');answerQuiz(v===q.answer,v);}
      else if(q.type==='keywords'&&QS.revealed&&(e.key==='1'||e.key==='2')){e.preventDefault();answerQuiz(e.key==='1',null);}
    }
  }
});

/* ---------- init ---------- */
const TABS=['summary','cards','quiz','tables','numbers'];
const hash=(location.hash||'').replace('#','');
if(TABS.includes(hash))S.tab=hash;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(TABS.includes(h)&&h!==S.tab)setTab(h);});
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
render();
})();
</script>
</body>
</html>
